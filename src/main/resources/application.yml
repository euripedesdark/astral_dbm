server:
  port: 8091

spring:
  application:
    name: astral-dbm

  # Banco PRÓPRIO do DBM (spec §0.14, §0.16): astral_dbm, schema public.
  # NÃO apontar para o banco do ERP/Astral.
  datasource:
    url: ${DBM_DB_URL:jdbc:postgresql://127.0.0.1:5432/astral_dbm}
    username: ${DBM_DB_USER:astral_dbm}
    password: ${DBM_DB_PASSWORD:astral_dbm}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      pool-name: dbm-interno

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  # O build do React vai para static/dist e é servido na raiz.
  web:
    resources:
      static-locations: classpath:/static/dist/,classpath:/static/

dbm:
  # Pool dos bancos-ALVO (as conexões que o usuário cadastra).
  pool:
    max-size: 4
    idle-timeout-ms: 60000
  # Limite duro de linhas devolvidas por browse/consulta.
  linhas-max: 1000
  # Consumo do contrato do Auth Service (§0.25). O DBM NÃO tem login próprio:
  # quando ligado, exige "Authorization: Bearer <token>" e pergunta ao Auth
  # Service quem é o portador. Desligado por padrão para a base seguir aberta
  # apenas em rede local durante o desenvolvimento.
  auth:
    enabled: ${DBM_AUTH_ENABLED:false}
    url: ${DBM_AUTH_URL:http://127.0.0.1:8181}
    me-path: ${DBM_AUTH_ME_PATH:/api/v1/identity/me}
    cache-seconds: ${DBM_AUTH_CACHE_SECONDS:60}
    timeout-ms: ${DBM_AUTH_TIMEOUT_MS:3000}